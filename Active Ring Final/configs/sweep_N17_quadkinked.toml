# sweep_N17_quadkinked.toml
# Log-spaced sweep over κ and f₀ for N = 17, quadruple-kinked circle IC (passive junction ON).
#
# Ring layout : 8 :active + 1 :passive + 8 :active_rev
# Initial condition : quadruple-kinked circle — outside-in reflections, depth k=4.
#                     Seven beads are moved (i±3, i±2, i±1, i=9); beads 5 and 13 stay on the circle.
#
# Grid  : 30 (κ) × 50 (f₀) = 1500 runs
# κ  : 1 → 50   log-spaced (30 values)
# f₀ : 1 → 120  log-spaced (50 values)
# kBT: fixed at base-config value (0.1)

[sweep]
base     = "configs/default.toml"
start_id = 1

[sweep.run]
outdir       = "results/Results_N17_quadkinked"
frames       = 1500
substeps     = 100
seed         = 42
bead_layout  = "antipolar_quadkinked"

[sweep.params]
N = [17]

[sweep.params.kappa]
logspace = [1, 50.0, 30]

[sweep.params.f0]
logspace = [1, 120.0, 50]
