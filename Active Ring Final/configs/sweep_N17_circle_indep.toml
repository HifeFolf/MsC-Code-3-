# sweep_N17_circle_indep.toml
# Identical physics/grid to sweep_N17_circle.toml, re-run AFTER the seeding fix.
#
# Why this exists:
#   The original Results_N17_circle sweep called Random.seed!(42) once per
#   combination, so all 1500 runs replayed the SAME thermal-noise sequence — they
#   were one noise realisation evaluated at 1500 parameter points, not 1500
#   independent samples.  run_sweep.jl now derives a per-run seed
#   (seed*1e6 + combo_index), so each parameter point gets its own stream while
#   the sweep stays exactly reproducible.
#
#   Written to a NEW output folder so the original data (and every figure built
#   from it) stays intact and the two can be compared directly.
#
# Grid  : 30 (κ) × 50 (f₀) = 1500 runs   — same as the original
# κ  : 1 → 50   log-spaced (30 values)
# f₀ : 1 → 120  log-spaced (50 values)

[sweep]
base     = "configs/default.toml"
start_id = 1

[sweep.run]
outdir       = "results/Results_N17_circle_indep"
frames       = 1500
substeps     = 100
seed         = 42
bead_layout  = "antipolar"

[sweep.params]
N = [17]

[sweep.params.kappa]
logspace = [1, 50.0, 30]

[sweep.params.f0]
logspace = [1, 120.0, 50]
