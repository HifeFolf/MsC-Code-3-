# sweep_N17.toml
# Log-spaced sweep over κ and f₀ for N = 17 (passive junction ON).
#
# Ring layout: 8 :active + 1 :passive + 8 :active_rev.
# The passive bead sits at the front junction (convergence point).
#
# Grid  : 30 (κ) × 50 (f₀) = 1500 runs
# κ  : 1 → 50   log-spaced (30 values)
# f₀ : 10 → 120 log-spaced (50 values)
# kBT: fixed at base-config value (0.1)
#
# Toggle between N=16 and N=17 by swapping sweep configs:
#   N=16 (passive off) → sweep_N16.toml
#   N=17 (passive on)  → this file

[sweep]
base     = "configs/default.toml"
start_id = 1

[sweep.run]
outdir   = "results/Results_N17"
frames   = 1500
substeps = 100
seed     = 42

[sweep.params]
N = [17]    # matches default.toml; explicit here for symmetry with sweep_N16.toml

[sweep.params.kappa]
logspace = [1, 50.0, 30]

[sweep.params.f0]
logspace = [1, 120.0, 50]
